{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">Реєстрація</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Ім’я користувача</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email (необов’язково)</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="bio" class="form-label">Про себе (для контексту нейромережі)</label>
                <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="Розкажіть про себе..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
        </form>
        <p class="mt-3 text-center">Вже маєте акаунт? <a href="{{ url_for('auth.login') }}">Увійдіть</a></p>
    </div>
</div>
{% endblock %}
